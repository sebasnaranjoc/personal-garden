@if (!isBoard()) {
  <header class="topbar">
    <a class="brand" routerLink="/">🌱 Personal Garden</a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/proyectos" routerLinkActive="active">Proyectos</a>
      <a routerLink="/tablero" routerLinkActive="active">Tablero</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
    </nav>
  </header>
}

<main class="content" [class.content--wide]="isBoard()">
  <router-outlet></router-outlet>
</main>

@if (!isBoard()) {
  <footer class="footer">
    <small>© 2026 Personal Garden — hecho con Angular</small>
  </footer>
}
